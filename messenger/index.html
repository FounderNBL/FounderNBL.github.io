<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBL Messenger has moved to Pulse</title><link rel="canonical" href="https://newbeansland.org/pulse/"><meta name="robots" content="noindex,follow">
<script>
"use strict";
const target=new URL("/pulse/",location.origin);
target.searchParams.set("messages","1");
const handle=new URL(location.href).searchParams.get("dm")||"";
if(/^@?[A-Za-z0-9_-]{2,64}$/.test(handle))target.searchParams.set("dm",handle.replace(/^@/,""));
location.replace(target.href);
</script></head><body><h1>NBL Messenger has moved to Pulse</h1><p>Your messages are now in <a href="/pulse/?messages=1">Pulse Social</a>.</p><p>Calling features are parked. Your account and messages are unchanged.</p></body></html>
