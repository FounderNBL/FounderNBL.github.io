<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Coming Soon | New Beansland</title>
  <meta name="description" content="This New Beansland door is marked, and the room is still being built.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#02060b">
  <link rel="canonical" href="https://newbeansland.org/coming-soon.html">
  <link rel="icon" type="image/png" href="nbl-primary-logo.png">
  <style>
    :root{--gold:#d6a14b;--gold2:#f0c56f;--cream:#f4ead8;--soft:#cfc3ad;--line:rgba(214,161,75,.4)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(2,6,11,.28),rgba(2,6,11,.86)),url("New_New_homepage.png") center/cover fixed;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
    .box{width:min(760px,100%);padding:34px clamp(22px,6vw,56px);border:1px solid var(--line);border-radius:18px;background:rgba(2,6,11,.88);box-shadow:0 22px 70px rgba(0,0,0,.52);backdrop-filter:blur(10px);text-align:center}
    .seal{width:116px;height:116px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 0 16px rgba(214,161,75,.18))}
    .kicker{margin:0 0 8px;color:var(--gold2);font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;color:var(--gold2);font:700 clamp(2.4rem,9vw,5rem)/1 Georgia,"Times New Roman",serif}
    p{max-width:590px;margin:15px auto 0;color:#e0d7c9;font:1.02rem/1.65 Arial,sans-serif}
    .room{color:#f1d298;font-weight:900}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
    a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 17px;border:1px solid var(--gold);border-radius:9px;color:#160e04;background:linear-gradient(180deg,#f0c56f,#c58a34);font-weight:900;text-decoration:none}
    a.secondary{color:var(--gold2);background:rgba(6,17,29,.85)}
    a:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}
  </style>
</head>
<body>
  <main class="box">
    <img class="seal" src="nbl-official-seal.png" alt="Official New Beansland seal">
    <p class="kicker">New Beansland · Under Construction</p>
    <h1>Coming Soon</h1>
    <p><span class="room" id="roomName">This room</span> is marked, but it is still being built. No dead doors. No fake rooms. When it is ready, it opens.</p>
    <div class="actions"><a href="/">Back to New Beansland</a><a class="secondary" href="books.html">Visit NBL Books</a></div>
  </main>
  <script>
    (() => {
      const names = {city:'The City / TV & Film',institute:'The Institute','timmy-v':'Timmy V Studios',news:'New Beansland News'};
      const key = new URLSearchParams(location.search).get('room');
      if (key && names[key]) document.getElementById('roomName').textContent = names[key];
    })();
  </script>
</body>
</html>
