<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02060b" />
  <title>NBL Studio | New Beansland</title>
  <link rel="icon" href="../assets/brand/nbl-primary-logo.png" />
  <link rel="stylesheet" href="./studio.css" />
</head>
<body>
  <main class="studio-shell">
    <header class="studio-header">
      <a class="back" href="../">← New Beansland</a>
      <img class="studio-mark" src="../assets/brand/NBL-Studios.png" alt="NBL Studios" />
      <div class="header-copy">
        <p class="eyebrow">NEW BEANSLAND PRESENTS</p>
        <h1>NBL Studio</h1>
        <p>Music, motion and Train Eater energy. Pick a record and press play.</p>
      </div>
    </header>

    <section class="player-card" aria-label="NBL music player">
      <div class="visual-stage" id="visualStage">
        <canvas id="visualizer" aria-hidden="true"></canvas>
        <video id="trackVideo" muted loop playsinline preload="metadata" hidden></video>
        <img id="coverArt" alt="Current track artwork" />
        <div class="visual-shade"></div>
        <div class="now-playing">
          <span id="nowLabel">SELECT A TRACK</span>
          <h2 id="trackTitle">NBL Studio</h2>
          <p id="trackArtist">New Beansland</p>
        </div>
      </div>

      <div class="controls">
        <button id="prevButton" type="button" aria-label="Previous track">⏮</button>
        <button id="playButton" class="play" type="button" aria-label="Play">▶</button>
        <button id="nextButton" type="button" aria-label="Next track">⏭</button>
      </div>

      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
        <span id="duration">0:00</span>
      </div>

      <div class="utility-row">
        <label class="volume">Volume <input id="volume" type="range" min="0" max="1" value="0.85" step="0.01" /></label>
        <span id="previewNotice" class="preview-notice"></span>
        <a id="purchaseButton" class="action" href="#" hidden>Get this track</a>
      </div>

      <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    </section>

    <section class="catalog-section">
      <div class="section-heading">
        <p class="eyebrow">THE CATALOG</p>
        <h2>Records</h2>
      </div>
      <div id="trackList" class="track-list"></div>
    </section>

    <footer>
      <p>© 2026 New Beansland. Artist and writing credits remain attached to each release.</p>
    </footer>
  </main>

  <script src="./catalog.js"></script>
  <script src="./player.js"></script>
</body>
</html>
