<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search New Beansland</title>
  <meta name="description" content="Search New Beansland with Google Programmable Search.">
  <meta name="theme-color" content="#02060b">
  <link rel="icon" type="image/png" href="/NBL-New-Official-Seal.png?v=c52ddcff">
  <link rel="stylesheet" href="/nbl-world-header.css?v=20260927-google-search">
  <script defer src="/nbl-world-header.js?v=20260927-google-search"></script>
  <script async src="https://cse.google.com/cse.js?cx=11117e9c434194b43"></script>
  <style>
    :root{--night:#02060b;--navy:#06111d;--gold:#d8a344;--gold2:#f0c873;--cream:#f5ead5;--muted:#b9b1a5;--line:rgba(216,163,68,.38)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(circle at 50% -10%,rgba(71,111,149,.18),transparent 32%),linear-gradient(180deg,var(--navy),var(--night));font-family:Arial,Helvetica,sans-serif}
    main{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:clamp(42px,8vw,88px) 0 90px}
    .hero{text-align:center;margin-bottom:28px}
    .kicker{margin:0 0 10px;color:var(--gold2);font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;color:var(--cream);font:700 clamp(2.35rem,7vw,4.8rem)/1.02 Georgia,"Times New Roman",serif}
    .intro{max-width:720px;margin:16px auto 0;color:var(--muted);font-size:1rem;line-height:1.65}
    .search-shell{padding:clamp(18px,4vw,34px);border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(11,27,43,.96),rgba(3,11,19,.98));box-shadow:0 24px 70px rgba(0,0,0,.32)}
    .search-note{margin:0 0 18px;color:#d8c7aa;font-size:.88rem;line-height:1.55}
    .gcse-search{min-height:120px}
    @media(max-width:600px){main{width:min(100% - 18px,1100px);padding-top:34px}.search-shell{padding:14px}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="kicker">New Beansland · Google Search</p>
      <h1>Search New Beansland</h1>
      <p class="intro">Use Google Programmable Search to find pages and public information across New Beansland.</p>
    </section>
    <section class="search-shell" aria-label="Search New Beansland">
      <p class="search-note">Search results are provided by Google and may take a moment to load.</p>
      <div class="gcse-search"></div>
    </section>
  </main>
</body>
</html>
