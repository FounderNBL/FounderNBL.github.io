  <style>
    :root{--navy:#02060b;--gold:#d99b42;--bright:#f3bf62;--cream:#f5ead7}
    *{box-sizing:border-box}
    html{background:var(--navy)}
    body{margin:0;background:var(--navy);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
    .page{position:relative;width:min(1800px,100%);margin:auto;background:var(--navy)}
    .site-header{position:absolute;z-index:10;top:0;left:0;right:0;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:11px clamp(18px,3vw,54px);line-height:1.2;background:linear-gradient(180deg,rgba(2,6,11,.99) 0%,rgba(2,6,11,.94) 68%,rgba(2,6,11,.42) 88%,transparent 100%)}
    .real-brand{display:flex;align-items:center;gap:11px;min-width:max-content;color:var(--cream);text-decoration:none}
    .real-brand img{display:block;width:48px;height:48px;object-fit:contain}
    .brand-name{display:block;color:#e0ad5b;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1rem,1.55vw,1.45rem);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .brand-tag{display:block;margin-top:4px;color:#d8c6a8;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase}
    .desktop-nav{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.45vw,25px);font-family:Arial,Helvetica,sans-serif;scrollbar-width:none}
    .desktop-nav::-webkit-scrollbar{display:none}
    .desktop-nav a{position:relative;padding:8px 0;color:#f5ead7;text-decoration:none;font-size:clamp(.76rem,1vw,.98rem);font-weight:700;letter-spacing:.025em;white-space:nowrap;text-shadow:0 2px 8px #000}
    .desktop-nav a:not(.walk-link)::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:var(--bright);transition:right .16s ease}
    .desktop-nav a:hover::after,.desktop-nav a:focus-visible::after{right:0}
    .desktop-nav .walk-link{padding:10px 15px;border:1px solid rgba(243,191,98,.75);border-radius:6px;color:#ffe3a4;background:rgba(8,17,28,.82)}
    .desktop-nav a:focus-visible,.real-brand:focus-visible{outline:3px solid var(--bright);outline-offset:4px}
    .art-shell{position:relative;width:100%;line-height:0;overflow:hidden;background:var(--navy);aspect-ratio:1672/941}
    .home-art{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;z-index:3;border:0;border-radius:10px;background:transparent;color:transparent;font-size:0;line-height:1;cursor:pointer;touch-action:manipulation;outline:none;-webkit-tap-highlight-color:transparent}
    .hotspot:active{background:rgba(243,191,98,.09)}
    .hotspot:focus-visible{outline:3px solid #f3bf62;outline-offset:-3px;background:rgba(243,191,98,.09)}
    @media (hover:none){.hotspot:focus-visible{outline:none;background:transparent}}
    @media (max-width:1180px){.site-header{gap:14px;padding-inline:18px}.desktop-nav{gap:11px}.desktop-nav a{font-size:.76rem}.desktop-nav .walk-link{padding:9px 11px}.real-brand img{width:42px;height:42px}.brand-name{font-size:1rem}.brand-tag{font-size:.55rem}}
    @media (max-width:900px){
      .site-header{position:relative;min-height:0;flex-wrap:wrap;gap:7px 14px;padding:10px 13px 9px;background:#02060b}
      .real-brand img{width:43px;height:43px}
      .brand-name{font-size:1.05rem}
      .brand-tag{font-size:.55rem}
      .desktop-nav{width:100%;justify-content:flex-start;gap:18px;overflow-x:auto;padding:2px 2px 7px;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}
      .desktop-nav a{font-size:.78rem;flex:0 0 auto}
      .desktop-nav .walk-link{padding:8px 11px}
    }
    @media (max-width:480px){.brand-tag{display:none}.brand-name{font-size:.94rem;letter-spacing:.06em}.real-brand{gap:7px}.real-brand img{width:39px;height:39px}.art-shell{min-width:100%}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
