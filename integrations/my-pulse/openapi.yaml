openapi: 3.1.0
info:
  title: My Pulse Founder-only bridge (draft, disabled)
  version: 0.1.0
  description: Secure staging/approval handoff; NOT registered with ChatGPT or deployed.
servers:
  - url: https://YOUR-PROJECT.supabase.co/functions/v1/nbl-my-pulse
paths:
  /:
    post:
      operationId: myPulseBridge
      description: |
        status and prepare use the server-side connector bearer secret.
        approve requires Founder's Clerk session bearer token.
        publish requires connector bearer plus separately minted Founder approval.
        Do not configure a ChatGPT Action until reviewed and deployed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [status, prepare, approve, publish]
                approval:
                  type: string
                draft:
                  $ref: '#/components/schemas/Draft'
      responses:
        '200':
          description: Provider response or prepared draft
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Disabled or unsupported destination
        '503':
          description: Missing configuration
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Draft:
      type: object
      required: [identity, channels, accounts, caption, media]
      properties:
        identity:
          type: string
          enum: [founder, jmelo, newbeansland, shia]
        channels:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [pulse, facebook_page, instagram]
        accounts:
          type: object
          additionalProperties:
            type: string
        caption:
          type: string
          maxLength: 1500
        media:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            format: uri
