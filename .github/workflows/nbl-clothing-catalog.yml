name: NBL Clothing Catalog Check

on:
  pull_request:
    paths:
      - "clothing.html"
      - "nbl-clothing-sync.js"
      - "nbl-kids.html"
      - "scripts/check-clothing-catalog.mjs"
      - "NBL*.png"
      - "not-so-small-*.png"
      - ".github/workflows/nbl-clothing-catalog.yml"
  push:
    branches: [main]
    paths:
      - "clothing.html"
      - "nbl-clothing-sync.js"
      - "nbl-kids.html"
      - "scripts/check-clothing-catalog.mjs"
      - "NBL*.png"
      - "not-so-small-*.png"
      - ".github/workflows/nbl-clothing-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check NBL clothing, Pride and Kids catalog boundaries
        run: node scripts/check-clothing-catalog.mjs
