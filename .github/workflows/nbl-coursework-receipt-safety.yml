# Historical academic coursework is held. No automatic runs or browser installs.
name: NBL Coursework receipt — dormant manual-only source safety
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-closure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check university.js
