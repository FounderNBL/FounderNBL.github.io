# NBL live website: focused regression evidence; source-only, no secrets or write tokens.
name: NBL Inspector and Fixer policy safety

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nbl-live-production-watch.yml"
      - ".github/workflows/nbl-google-fixer.yml"
      - "scripts/nbl-google-fixer-policy.mjs"
      - "scripts/nbl-google-fixer-guard.mjs"
      - "tests/security/nbl-google-fixer-policy.test.mjs"
      - "tests/security/nbl-live-production-watch-policy.test.mjs"
      - ".github/workflows/nbl-inspector-policy-gate.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nbl-live-production-watch.yml"
      - ".github/workflows/nbl-google-fixer.yml"
      - "scripts/nbl-google-fixer-policy.mjs"
      - "scripts/nbl-google-fixer-guard.mjs"
      - "tests/security/nbl-google-fixer-policy.test.mjs"
      - "tests/security/nbl-live-production-watch-policy.test.mjs"
      - ".github/workflows/nbl-inspector-policy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout website source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify NBL Inspector and Fixer policy safety
        run: |
          node --test tests/security/nbl-google-fixer-policy.test.mjs tests/security/nbl-live-production-watch-policy.test.mjs
      - name: Publish scope boundary
        if: always()
        run: |
          echo "This check reads local website source only. It does not exercise paid AI, live customer payments, real student data, Android signing, or production deployments." >> "$GITHUB_STEP_SUMMARY"
