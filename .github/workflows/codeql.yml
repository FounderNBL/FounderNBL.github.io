name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results

      - name: Diagnose CodeQL finding locations without source contents
        if: ${{ always() && steps.codeql.outcome == 'success' }}
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from "node:fs";
          import {join} from "node:path";
          const dir=process.env.SARIF_DIR;
          if(!dir){console.log("CodeQL SARIF path unavailable");process.exit(0);}
          for(const name of readdirSync(dir).filter(x=>x.endsWith(".sarif")).slice(0,6)){
            const data=JSON.parse(readFileSync(join(dir,name),"utf8"));
            for(const run of data.runs||[]){
              const rules=new Map((run.tool?.driver?.rules||[]).map(x=>[x.id,x]));
              const results=(run.results||[]).filter(x=>
                (x.locations||[]).some(y=>/scripts\\/nbl-(?:repair|website-repair|website-economy|foundation-repair)/.test(y.physicalLocation?.artifactLocation?.uri||"")));
              for(const item of results.slice(0,35)){
                const loc=item.locations?.[0]?.physicalLocation;
                const rule=rules.get(item.ruleId);
                const severity=rule?.properties?.["security-severity"]||rule?.properties?.severity||item.level;
                console.log("CodeQL finding",JSON.stringify({rule:item.ruleId,
                  severity,path:loc?.artifactLocation?.uri,line:loc?.region?.startLine}));
              }
              console.log("Relevant CodeQL findings:",results.length);
            }
          }
          NODE
