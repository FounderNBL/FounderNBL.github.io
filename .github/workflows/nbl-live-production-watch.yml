name: NBL live production watch

on:
  schedule:
    # Daily production smoke check using the existing public-repo CI instead of
    # adding another paid monitoring service.
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check key live routes over HTTPS
        run: |
          set -euo pipefail
          for url in             https://newbeansland.org/             https://newbeansland.org/books.html             https://newbeansland.org/stories.html             https://newbeansland.org/founder-office.html             https://newbeansland.org/studio/             https://newbeansland.org/account.html             https://newbeansland.org/university.html; do
            curl --fail --silent --show-error --location --max-time 20 --output /dev/null "$url"
          done

      - name: Check the live NBL web app on desktop and mobile
        env:
          NBL_BASE_URL: https://newbeansland.org
          NBL_EXPECT_BILLING_LIVE: "1"
        run: npx playwright test --project=chromium --project=mobile-chromium

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nbl-live-watch-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
