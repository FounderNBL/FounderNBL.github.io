name: NBL Website Health Inspector

on:
  push:
    branches:
      - main
  schedule:
    # Lightweight production route inspection every hour.
    - cron: "17 * * * *"
    # Full desktop/mobile browser inspection once per day.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  route-inspection:
    name: Health Inspector · live routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect registered production routes
        id: routes
        shell: bash
        run: |
          set +e
          failed=0
          unverified=0
          all_verified=true
          : > health-route-results.txt

          urls=(
            "https://newbeansland.org/"
            "https://newbeansland.org/books.html"
            "https://newbeansland.org/stories.html"
            "https://newbeansland.org/founder-office.html"
            "https://newbeansland.org/studio/"
            "https://newbeansland.org/account.html"
            "https://newbeansland.org/university.html"
            "https://nblworld.com/"
            "https://nblworld.com/university.html"
          )

          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"

          for url in "${urls[@]}"; do
            headers="$RUNNER_TEMP/nbl-inspector-response-headers.txt"
            : > "$headers"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$user_agent" --dump-header "$headers" --output /dev/null --write-out "%{http_code}" "$url")"
            curl_status=$?
            if [ "$curl_status" -ne 0 ]; then
              code="000"
            fi

            printf "%s %s\n" "$code" "$url" | tee -a health-route-results.txt
            if [ "$code" = "403" ]; then
              # Record only safe Cloudflare diagnostic headers, never cookies/tokens.
              ray="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="cf-ray:"{gsub("\\r","",$2);val=$2} END{print val}' "$headers")"
              mitigated="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="cf-mitigated:"{gsub("\\r","",$2);val=$2} END{print val}' "$headers")"
              printf "INSPECTOR_NETWORK_DENIAL url=%s http=403 cf_ray=%s cf_mitigated=%s\n" "$url" "${ray:-unknown}" "${mitigated:-unknown}" | tee -a health-route-results.txt
              echo "::warning::HTTP 403 from GitHub Actions runner for $url. This is not independent proof of public outage. Investigate Cloudflare WAF/bot evidence by Ray ID."
            fi

            case "$code" in
              2*|3*)
                printf "PASS url=%s http=%s (runner reachability only)\n" "$url" "$code" >> health-route-results.txt
                ;;
              403|429|000)
                # Runner denial, rate limiting, or network failure cannot prove customer outage.
                # Preserve all evidence without inventing either a FAIL or a PASS.
                unverified=1
                all_verified=false
                printf "UNVERIFIED url=%s http=%s (independent browser confirmation required)\n" "$url" "$code" | tee -a health-route-results.txt
                echo "::warning::Unverified runner response ($code) for $url; no customer-visible outage confirmed."
                ;;
              *)
                failed=1
                all_verified=false
                printf "FAIL url=%s http=%s (confirmed response requires review)\n" "$url" "$code" | tee -a health-route-results.txt
                ;;
            esac
          done

          echo "all_verified=$all_verified" >> "$GITHUB_OUTPUT"
          if [ "$unverified" -ne 0 ]; then
            echo "::warning::One or more routes are UNVERIFIED. Workflow success does not mean every route passed."
          fi
          exit "$failed"

      - name: Publish route inspection summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NBL Website Health Inspector"
            echo
            echo "### Live route inspection"
            echo '~~~text'
            cat health-route-results.txt 2>/dev/null || true
            echo '~~~'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update route incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] Live route failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live route failure") | .number' | head -n 1)"

          body="$(printf 'The Website Health Inspector found one or more production routes unhealthy.\n\n**Fixer handoff:** assign this issue to Copilot and select the custom agent **The Fixer**. The Fixer must identify the root cause, the escape point, add regression protection, and return a PR.\n\nRun: %s/%s/actions/runs/%s\n\nResults:\n~~~text\n%s\n~~~' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat health-route-results.txt 2>/dev/null)")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Reclassify unverified routes without claiming customer outage
        if: success() && steps.routes.outputs.all_verified == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] Live routes unverified"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live routes unverified") | .number' | head -n 1)"
          body="$(printf 'Automated route inspection was inconclusive because the runner was denied or could not reach some URLs. This does NOT prove customers see an outage. Obtain independent browser evidence.\n\nRun: %s/%s/actions/runs/%s\n\nResults:\n~~~text\n%s\n~~~' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat health-route-results.txt 2>/dev/null)")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          old="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live route failure") | .number' | head -n 1)"
          if [ -n "$old" ]; then
            gh issue comment "$old" --repo "$GITHUB_REPOSITORY" --body "Reclassified: the latest runner evidence is UNVERIFIED rather than a confirmed route failure. See the separate unverified issue; we have NOT proven customer reachability. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$old" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Confirm route recovery
        # Never close a real incident just because Cloudflare challenged the probe.
        if: success() && steps.routes.outputs.all_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for title in "[Health Inspector] Live route failure" "[Health Inspector] Live routes unverified"; do
            existing="$(NBL_ISSUE_TITLE="$title" gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title==env.NBL_ISSUE_TITLE) | .number' | head -n 1)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "All monitored routes now respond 2xx/3xx to the Inspector runner; this is NOT a complete real-customer signup or checkout test. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
            fi
          done

  deep-browser-inspection:
    name: Health Inspector · external desktop + mobile
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 14 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Wait for the deployed Chat asset to match this release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum nbl-world-header.js | awk '{print $1}')"
          for attempt in $(seq 1 30); do
            live="$RUNNER_TEMP/nbl-world-header-live.js"
            rm -f "$live"
            if curl --fail --silent --show-error --location --max-time 20               -H "Cache-Control: no-cache"               "https://newbeansland.org/nbl-world-header.js?health=$GITHUB_SHA-$attempt"               --output "$live"; then
              actual="$(sha256sum "$live" | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "Live Chat asset matches this release."
                exit 0
              fi
            fi
            echo "Waiting for Pages deployment to catch up ($attempt/30)…"
            sleep 10
          done
          echo "Live Chat asset did not match the release source within 5 minutes."
          exit 1

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect live New Beansland + NBL World on desktop and mobile
        env:
          NBL_BASE_URL: https://newbeansland.org
          NBL_EXPECT_BILLING_LIVE: "1"
        run: npx playwright test --project=chromium --project=mobile-chromium

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nbl-health-inspector-browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update browser incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] Live browser failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live browser failure") | .number' | head -n 1)"
          body="The Website Health Inspector found a desktop/mobile production browser failure. **Fixer handoff:** assign this issue to Copilot and select the custom agent **The Fixer**. The Fixer must identify the root cause, the escape point, add regression protection, and return a PR. Failure evidence is attached to the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Record external browser improvement without auto-closing incidents
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Cloudflare-challenged browser routes can be UNVERIFIED/skipped.
          # Local-source PASS cannot prove a visitor or real-device PASS.
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live browser failure") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Automated external browser checks completed without a test failure. Do not auto-close this incident: a Cloudflare-challenged test may be UNVERIFIED, and independent visitor/device proof is required. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
