name: NBL Website Health Inspector

on:
  push:
    branches:
      - main
  schedule:
    # Lightweight production route inspection every hour.
    - cron: "17 * * * *"
    # Full desktop/mobile browser inspection once per day.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  route-inspection:
    name: Health Inspector · live routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect registered production routes
        shell: bash
        run: |
          set +e
          failed=0
          : > health-route-results.txt

          urls=(
            "https://newbeansland.org/"
            "https://newbeansland.org/books.html"
            "https://newbeansland.org/stories.html"
            "https://newbeansland.org/founder-office.html"
            "https://newbeansland.org/studio/"
            "https://newbeansland.org/account.html"
            "https://newbeansland.org/university.html"
            "https://nblworld.com/"
            "https://nblworld.com/university.html"
          )

          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"

          for url in "${urls[@]}"; do
            headers="$RUNNER_TEMP/nbl-inspector-response-headers.txt"
            : > "$headers"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$user_agent" --dump-header "$headers" --output /dev/null --write-out "%{http_code}" "$url")"
            curl_status=$?
            if [ "$curl_status" -ne 0 ]; then
              code="000"
            fi

            printf "%s %s\n" "$code" "$url" | tee -a health-route-results.txt
            if [ "$code" = "403" ]; then
              # Record only safe Cloudflare diagnostic headers, never cookies/tokens.
              ray="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="cf-ray:"{gsub("\\r","",$2);val=$2} END{print val}' "$headers")"
              mitigated="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="cf-mitigated:"{gsub("\\r","",$2);val=$2} END{print val}' "$headers")"
              printf "INSPECTOR_NETWORK_DENIAL url=%s http=403 cf_ray=%s cf_mitigated=%s\n" "$url" "${ray:-unknown}" "${mitigated:-unknown}" | tee -a health-route-results.txt
              echo "::warning::HTTP 403 from GitHub Actions runner for $url. This is not independent proof of public outage. Investigate Cloudflare WAF/bot evidence by Ray ID."
            fi

            case "$code" in
              2*|3*) ;;
              *) failed=1 ;;
            esac
          done

          exit "$failed"

      - name: Publish route inspection summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NBL Website Health Inspector"
            echo
            echo "### Live route inspection"
            echo '~~~text'
            cat health-route-results.txt 2>/dev/null || true
            echo '~~~'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update route incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] Live route failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live route failure") | .number' | head -n 1)"

          body="$(printf 'The Website Health Inspector found one or more production routes unhealthy.\n\n**Fixer handoff:** assign this issue to Copilot and select the custom agent **The Fixer**. The Fixer must identify the root cause, the escape point, add regression protection, and return a PR.\n\nRun: %s/%s/actions/runs/%s\n\nResults:\n~~~text\n%s\n~~~' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat health-route-results.txt 2>/dev/null)")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Confirm route recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live route failure") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Health Inspector recovery check passed. All registered production routes are responding again. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

  deep-browser-inspection:
    name: Health Inspector · desktop + mobile
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 14 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Wait for the deployed Chat asset to match this release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum nbl-world-header.js | awk '{print $1}')"
          for attempt in $(seq 1 30); do
            live="$RUNNER_TEMP/nbl-world-header-live.js"
            rm -f "$live"
            if curl --fail --silent --show-error --location --max-time 20               -H "Cache-Control: no-cache"               "https://newbeansland.org/nbl-world-header.js?health=$GITHUB_SHA-$attempt"               --output "$live"; then
              actual="$(sha256sum "$live" | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "Live Chat asset matches this release."
                exit 0
              fi
            fi
            echo "Waiting for Pages deployment to catch up ($attempt/30)…"
            sleep 10
          done
          echo "Live Chat asset did not match the release source within 5 minutes."
          exit 1

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect live New Beansland + NBL World on desktop and mobile
        env:
          NBL_BASE_URL: https://newbeansland.org
          NBL_EXPECT_BILLING_LIVE: "1"
        run: npx playwright test --project=chromium --project=mobile-chromium

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nbl-health-inspector-browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update browser incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] Live browser failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live browser failure") | .number' | head -n 1)"
          body="The Website Health Inspector found a desktop/mobile production browser failure. **Fixer handoff:** assign this issue to Copilot and select the custom agent **The Fixer**. The Fixer must identify the root cause, the escape point, add regression protection, and return a PR. Failure evidence is attached to the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Confirm browser recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] Live browser failure") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Health Inspector recovery check passed on desktop and mobile. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

  browserstack-real-device-inspection:
    name: Health Inspector · BrowserStack real device
    needs: deep-browser-inspection
    # The real-device gate is independent evidence, not permission granted by a
    # GitHub-hosted runner: Cloudflare may challenge one while serving another.
    # Never let a runner-specific 403 silently SKIP the real-device test.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 14 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - name: Check BrowserStack credentials
        id: browserstack
        shell: bash
        run: |
          if [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## BrowserStack real-device inspection"
              echo
              echo "SKIP — add BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY as GitHub Actions secrets to enable this gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out repository
        if: steps.browserstack.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.browserstack.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright and BrowserStack SDK
        if: steps.browserstack.outputs.configured == 'true'
        run: npm install --no-save @playwright/test@latest browserstack-node-sdk@latest

      - name: Create ephemeral BrowserStack release-gate config
        if: steps.browserstack.outputs.configured == 'true'
        shell: bash
        run: |
          cat > browserstack.yml <<EOF
          userName: "$BROWSERSTACK_USERNAME"
          accessKey: "$BROWSERSTACK_ACCESS_KEY"
          framework: playwright
          projectName: NBL Website Health Inspector
          buildName: NBL BrowserStack Release Gate
          platforms:
            - os: Windows
              osVersion: 11
              browserName: chrome
              browserVersion: latest
              playwrightConfigOptions:
                name: windows-chrome
                use:
                  baseURL: https://newbeansland.org
            - deviceName: Samsung Galaxy S25 Ultra
              osVersion: 15.0
              browserName: chrome
              playwrightConfigOptions:
                name: samsung-android
                use:
                  baseURL: https://newbeansland.org
          parallelsPerPlatform: 1
          browserstackLocal: false
          debug: true
          networkLogs: true
          consoleLogs: info
          selfHeal: false
          EOF

      - name: Run BrowserStack release gate
        if: steps.browserstack.outputs.configured == 'true'
        env:
          NBL_BASE_URL: https://newbeansland.org
          NBL_EXPECT_BILLING_LIVE: "1"
        run: npx browserstack-node-sdk playwright test --config=playwright.config.mjs

      - name: Upload BrowserStack failure evidence
        if: failure() && steps.browserstack.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nbl-browserstack-real-device-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update BrowserStack incident
        if: failure() && steps.browserstack.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Health Inspector] BrowserStack real-device failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] BrowserStack real-device failure") | .number' | head -n 1)"
          body="The BrowserStack release gate failed on a real desktop/mobile target. Self-healing is OFF for this gate so a broken locator or critical journey cannot silently become PASS. **Fixer handoff:** identify the root cause, add regression protection, and return a repair PR. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Confirm BrowserStack recovery
        if: success() && steps.browserstack.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title=="[Health Inspector] BrowserStack real-device failure") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "BrowserStack real-device recovery check passed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
