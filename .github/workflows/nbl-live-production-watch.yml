name: NBL live production watch

on:
  schedule:
    # Twice weekly: Monday and Thursday. This keeps the live browser watch
    # roughly 3–4 days apart without wasting hourly CI runs.
    - cron: "17 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check the live NBL web app
        # NBL_BASE_URL intentionally tells the shared smoke suite that this is
        # production, so branch-only release-candidate assertions stay on the
        # local PR browser run until the Founder actually publishes them.
        env:
          NBL_BASE_URL: https://newbeansland.org
          # Pull requests still point at the currently deployed site, so do not
          # expect unreleased billing UI there. Scheduled/manual runs on main
          # happen after publication and must verify the billing release UI.
          NBL_EXPECT_BILLING_LIVE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: npx playwright test --project=chromium

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nbl-live-watch-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
