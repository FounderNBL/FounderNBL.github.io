name: Private framework boundary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Block private NBL framework source from Production
        run: node scripts/check-private-framework-boundary.mjs
