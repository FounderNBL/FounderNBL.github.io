name: Beans $4.99 website checkout wiring
on:
  pull_request:
    paths:
      - "nbl-world-header.js"
      - "account.html"
      - "scripts/check-beans-499-web-checkout.test.mjs"
      - ".github/workflows/beans-499-website-checkout.yml"
  push:
    branches: [main]
    paths:
      - "nbl-world-header.js"
      - "account.html"
      - "scripts/check-beans-499-web-checkout.test.mjs"
      - ".github/workflows/beans-499-website-checkout.yml"
permissions:
  contents: read
jobs:
  checkout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test scripts/check-beans-499-web-checkout.test.mjs
