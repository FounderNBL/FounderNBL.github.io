name: Founder’s Office reading page check
on:
  pull_request:
    paths:
      - "founder-office.html"
      - "scripts/check-founder-office.mjs"
      - ".github/workflows/founder-office-check.yml"
  push:
    branches: [main]
    paths:
      - "founder-office.html"
      - "scripts/check-founder-office.mjs"
      - ".github/workflows/founder-office-check.yml"
permissions:
  contents: read
jobs:
  verify-office:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Office read-only layout and existing image files
        run: |
          node --check scripts/check-founder-office.mjs
          node scripts/check-founder-office.mjs
