name: Founder Office and Games hibernation — manual source check
# No automated game/office checks while department is dormant.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-hibernation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-founder-office.mjs
