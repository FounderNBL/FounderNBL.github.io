name: NBL Pulse Stream policy — one-time guarded install
on:
  push:
    branches:
      - work/nbl-pulse-moderation-policy-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-install-unattached:
    if: github.repository == 'FounderNBL/FounderNBL.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
      NBL_STREAM_APP_ENV: DEV
      NBL_STREAM_MODERATION_APPLY_ACK: CREATE_UNATTACHED_NBL_PULSE_POLICY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local policy tests without paid API calls
        run: |
          node --check scripts/nbl-pulse-moderation-policy.mjs
          node --test scripts/check-nbl-pulse-moderation-policy.test.mjs
          node scripts/nbl-pulse-moderation-policy.mjs --dry-run
      - name: Use existing GitHub secret names only, never print values
        run: |
          if [ -z "$STREAM_API_KEY" ] || [ -z "$STREAM_API_SECRET" ]; then
            echo "::warning::Stream Actions secrets are unavailable in this repo. Nothing was installed; existing Supabase credentials remain untouched."
            echo "NBL_NO_STREAM_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "NBL_NO_STREAM_SECRETS=false" >> "$GITHUB_ENV"
          fi
      - name: Create the unattached NBL Pulse review policy
        if: env.NBL_NO_STREAM_SECRETS == 'false'
        run: node scripts/nbl-pulse-moderation-policy.mjs --apply
