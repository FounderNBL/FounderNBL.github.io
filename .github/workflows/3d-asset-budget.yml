name: 3D asset budget

on:
  pull_request:
    paths:
      - "assets/3d/**"
      - "scripts/check-3d-asset-budget.mjs"
      - ".github/workflows/3d-asset-budget.yml"
  push:
    branches:
      - main
    paths:
      - "assets/3d/**"
      - "scripts/check-3d-asset-budget.mjs"
      - ".github/workflows/3d-asset-budget.yml"

permissions:
  contents: read

jobs:
  check-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check New Beansland 3D budgets
        run: node scripts/check-3d-asset-budget.mjs
