# Retired automatic University campus browser checks during Founder-directed hibernation.
# Source preserved; only explicitly invoked manual verification may run.
name: NBL Campus — dormant manual-only protected entrance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-closure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-campus-protected-source.mjs
