name: NBL website chat parity

on:
  push:
    branches: [main]
    paths:
      - "nbl-world-header.js"
      - "nbl-world-header.css"
      - "nbl-product-plans.js"
      - "nbl-university-checkout.js"
      - "**.html"
      - "account.html"
      - "account-deletion.html"
      - "scripts/check-website-chat-plus.mjs"
      - "scripts/check-website-chat-parity.mjs"
      - "scripts/check-website-repair.mjs"
      - "scripts/check-org-member-services.mjs"
      - "chat.js"
      - "chat.css"
      - "university.js"
      - "university.css"
      - "study-lab.mjs"
      - "study-lab.css"
      - "social-realtime.js"
      - "voice-lab.js"
      - "voice-lab.css"
      - "playwright.config.mjs"
      - "nbl-reader.js"
      - "nbl-reader.css"
      - "tests/browser/**"
      - "studio/creator.js"
      - "studio/creator.css"
      - "tests/security/studios-creator.test.mjs"
      - ".github/workflows/nbl-website-chat-parity.yml"
  pull_request:
    paths:
      - "nbl-world-header.js"
      - "nbl-world-header.css"
      - "nbl-product-plans.js"
      - "nbl-university-checkout.js"
      - "**.html"
      - "account.html"
      - "account-deletion.html"
      - "scripts/check-website-chat-plus.mjs"
      - "scripts/check-website-chat-parity.mjs"
      - "scripts/check-website-repair.mjs"
      - "scripts/check-org-member-services.mjs"
      - "chat.js"
      - "chat.css"
      - "university.js"
      - "university.css"
      - "study-lab.mjs"
      - "study-lab.css"
      - "social-realtime.js"
      - "voice-lab.js"
      - "voice-lab.css"
      - "playwright.config.mjs"
      - "nbl-reader.js"
      - "nbl-reader.css"
      - "tests/browser/**"
      - "studio/creator.js"
      - "studio/creator.css"
      - "tests/security/studios-creator.test.mjs"
      - ".github/workflows/nbl-website-chat-parity.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check website JavaScript syntax
        run: |
          node --check nbl-world-header.js
          node --check nbl-university-checkout.js
      - name: Check NBL Chat Plus wiring
        run: node scripts/check-website-chat-plus.mjs
      - name: Check website Chat standard regressions
        run: node scripts/check-website-chat-parity.mjs
      - name: Check website-only repair regressions
        run: node scripts/check-website-repair.mjs
      - name: Verify Clerk-primary member Chat, LOCKE/University and voice security rails
        run: |
          node --check chat.js
          node --check university.js
          node --check social-realtime.js
          node --check study-lab.mjs
          node --check voice-lab.js
          node scripts/check-org-member-services.mjs
      - name: Check NBL Studios creator preview
        run: |
          node --check studio/creator.js
          node --test tests/security/studios-creator.test.mjs
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Run real browser smoke checks
        run: npx playwright test --project=chromium --project=mobile-chromium
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nbl-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
