name: NBL website chat parity

on:
  push:
    branches: [main]
    paths:
      - "nbl-world-header.js"
      - "nbl-device-pdf.js"
      - "nbl-world-header.css"
      - "nbl-product-plans.js"
      - "nbl-university-checkout.js"
      - "**.html"
      - "account.html"
      - "account-deletion.html"
      - "scripts/check-website-chat-plus.mjs"
      - "scripts/check-website-chat-parity.mjs"
      - "scripts/check-v12-beans-grey-visual.test.mjs"
      - "scripts/check-website-repair.mjs"
      - "scripts/check-org-member-services.mjs"
      - "scripts/check-campus-protected-source.mjs"
      - "chat.js"
      - "chat.css"
      - "university.js"
      - "university.css"
      - "study-lab.mjs"
      - "study-lab.css"
      - "social-realtime.js"
      - "voice-lab.js"
      - "voice-lab.css"
      - "playwright.config.mjs"
      - "nbl-reader.js"
      - "nbl-reader.css"
      - "tests/browser/**"
      - "tests/study-lab.test.mjs"
      - "tests/voice-lab-source.test.mjs"
      - "studio/creator.js"
      - "studio/creator.css"
      - "tests/security/studios-creator.test.mjs"
      - ".github/workflows/nbl-website-chat-parity.yml"
      # Pulse-only updates use their dedicated checks, not the full site browser suite.
      - "!pulse/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "nbl-world-header.js"
      - "nbl-device-pdf.js"
      - "nbl-world-header.css"
      - "nbl-product-plans.js"
      - "nbl-university-checkout.js"
      - "**.html"
      - "account.html"
      - "account-deletion.html"
      - "scripts/check-website-chat-plus.mjs"
      - "scripts/check-website-chat-parity.mjs"
      - "scripts/check-v12-beans-grey-visual.test.mjs"
      - "scripts/check-website-repair.mjs"
      - "scripts/check-org-member-services.mjs"
      - "scripts/check-campus-protected-source.mjs"
      - "chat.js"
      - "chat.css"
      - "university.js"
      - "university.css"
      - "study-lab.mjs"
      - "study-lab.css"
      - "social-realtime.js"
      - "voice-lab.js"
      - "voice-lab.css"
      - "playwright.config.mjs"
      - "nbl-reader.js"
      - "nbl-reader.css"
      - "tests/browser/**"
      - "tests/study-lab.test.mjs"
      - "tests/voice-lab-source.test.mjs"
      - "studio/creator.js"
      - "studio/creator.css"
      - "tests/security/studios-creator.test.mjs"
      - ".github/workflows/nbl-website-chat-parity.yml"
      # Pulse-only updates use their dedicated checks, not the full site browser suite.
      - "!pulse/**"

# PR edits supersede older PR revisions, not main/release work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep browser dependencies in exactly one job instead of installing Chromium twice.
  beans-services:
    name: Website Beans service actions
    # Heavy browser verification is deferred until the draft is ready.
    # Keep the existing job name for branch-protection status compatibility.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check Beans website source
        run: |
          node --check nbl-world-header.js
          node --check tests/browser/beans-service-actions.spec.mjs
          node scripts/check-website-chat-plus.mjs
          node --test scripts/check-beans-web-login-layout.test.mjs
      - name: Install existing website browser tooling
        run: npm install --no-save @playwright/test@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run one complete website browser suite (includes Beans service actions)
        run: npx playwright test --project=chromium --project=mobile-chromium
      - name: Upload browser failure evidence (single suite)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: beans-services-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check website JavaScript syntax
        run: |
          node --check nbl-world-header.js
          node --check nbl-device-pdf.js
          node --check nbl-university-checkout.js
      - name: Check NBL Chat Plus wiring
        run: node scripts/check-website-chat-plus.mjs
      - name: Check website Chat standard regressions
        run: |
          node scripts/check-website-chat-parity.mjs
          node --test scripts/check-v12-beans-grey-visual.test.mjs scripts/check-beans-web-login-layout.test.mjs
      - name: Check website-only repair regressions
        run: node scripts/check-website-repair.mjs
      - name: Verify Clerk-primary member Chat, LOCKE/University and voice security rails
        run: |
          node --check chat.js
          node --check university.js
          node --check social-realtime.js
          node --check study-lab.mjs
          node --check voice-lab.js
          node scripts/check-org-member-services.mjs
          node scripts/check-campus-protected-source.mjs
          node --test tests/study-lab.test.mjs tests/voice-lab-source.test.mjs
      - name: Check NBL Studios creator preview
        run: |
          node --check studio/creator.js
          node --check studio/still.js
          node --check studio/google.js
          node --test tests/security/studios-creator.test.mjs scripts/check-still-independent.test.mjs scripts/check-nbl-connect-account.test.mjs scripts/check-studio-google.test.mjs

