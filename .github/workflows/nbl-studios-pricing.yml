name: NBL Studios, Music and Pricing — Source Gate
on:
  pull_request:
    paths:
      - index.html
      - studios.html
      - pricing.html
      - university.html
      - studio/index.html
      - studio/creator.html
      - studio/creator.js
      - studio/catalog.js
      - nbl-world-header.js
      - nbl-product-plans.js
      - scripts/check-studios-pricing-separation.test.mjs
      - scripts/check-approved-world-card-art.test.mjs
      - tests/security/studios-creator.test.mjs
      - .github/workflows/nbl-studios-pricing.yml
  push:
    branches: [main]
    paths:
      - index.html
      - studios.html
      - pricing.html
      - university.html
      - studio/index.html
      - studio/creator.html
      - nbl-world-header.js
      - nbl-product-plans.js
      - scripts/check-studios-pricing-separation.test.mjs
      - .github/workflows/nbl-studios-pricing.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-paid-service-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify distinct departments, offer prices, refund terms and checkout holds
        run: node --test scripts/check-studios-pricing-separation.test.mjs tests/security/studios-creator.test.mjs scripts/check-approved-world-card-art.test.mjs
      - name: Verify JavaScript syntax
        run: node --check nbl-world-header.js && node --check nbl-product-plans.js && node --check studio/creator.js
