# NBL live website: focused regression evidence; source-only, no secrets or write tokens.
name: NBL Account sign-in loop guard

on:
  pull_request:
    branches: [main]
    paths:
      - "account.html"
      - "nbl-world-header.js"
      - "nbl-portal.js"
      - "nbl-product-plans.js"
      - "tests/browser/account-signin-billing-loop.spec.mjs"
      - "playwright.config.mjs"
      - ".github/workflows/nbl-account-loop-guard.yml"
  push:
    branches: [main]
    paths:
      - "account.html"
      - "nbl-world-header.js"
      - "nbl-portal.js"
      - "nbl-product-plans.js"
      - "tests/browser/account-signin-billing-loop.spec.mjs"
      - "playwright.config.mjs"
      - ".github/workflows/nbl-account-loop-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install isolated browser test tools
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium
      - name: Verify NBL Account sign-in loop guard on desktop and mobile against local source
        run: npx playwright test tests/browser/account-signin-billing-loop.spec.mjs --project=chromium --project=mobile-chromium
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nbl-account-loop-guard-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish scope boundary
        if: always()
        run: |
          echo "This check reads local website source only. It does not exercise paid AI, live customer payments, real student data, Android signing, or production deployments." >> "$GITHUB_STEP_SUMMARY"
