name: Pulse — backend parity and restricted source gate
on:
  push:
    branches:
      - work/nbl-pulse-homeworld-stream-feeds-20261106
    paths:
      - 'pulse/**'
      - 'messenger/social-v1.*'
      - 'messenger/social-video-connect.mjs'
      - 'supabase/functions/nbl-social/**'
      - 'supabase/migrations/*nbl_pulse*'
      - '.github/workflows/nbl-pulse-backend-source.yml'
  pull_request:
    paths:
      - 'pulse/**'
      - 'messenger/social-v1.*'
      - 'messenger/social-video-connect.mjs'
      - 'supabase/functions/nbl-social/**'
      - 'supabase/migrations/*nbl_pulse*'
permissions:
  contents: read
jobs:
  source-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: NBL Pulse existing source checks
        run: |
          node --check messenger/social-v1.mjs
          node scripts/check-nbl-social-v1.mjs
      - name: Verify private friend migration and Clerk backend actions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const api=readFileSync('supabase/functions/nbl-social/index.ts','utf8');
          const ddl=readFileSync('supabase/migrations/20261107_nbl_pulse_friend_requests.sql','utf8');
          const front=readFileSync('pulse/index.html','utf8');
          for(const action of ['social_profile','friends_list','friend_request','friend_accept','friend_decline','friend_remove']) assert.ok(api.includes('action==="'+action+'"') || (api.includes('"'+action+'"') && api.includes('action==="friend_request"')),action);
          assert.match(api,/const me=await actor\(req\)/);
          assert.match(api,/async function pulseBlocked\(/);
          assert.match(api,/friend_request_daily_limit/);
          assert.match(ddl,/enable row level security/);
          assert.match(ddl,/revoke all.*anon,authenticated/i);
          assert.match(front,/Go Live · setup pending/);
          assert.match(front,/disabled>Go Live/);
          const bridge=readFileSync('supabase/functions/nbl-stream/index.ts','utf8');
          assert.match(bridge,/pulseModerationHealth/);
          assert.ok(bridge.includes('moderation/config/feeds%3Auser'));
          assert.doesNotMatch(bridge,/pulse_founder_preview_only/);
          const pulseUI=readFileSync('messenger/social-v1.mjs','utf8');
          assert.match(pulseUI,/entity_type:"stream:feeds:v3:activity"/);
          assert.match(pulseUI,/entity_type:"stream:feeds:v3:comment"/);
          assert.ok(front.includes('id="postMedia" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"'));
          assert.ok(front.includes('id="videoShareRights" type="checkbox"'));
          assert.match(pulseUI,/MAX_VIDEO_BYTES=40\*1024\*1024/);
          assert.match(pulseUI,/VIDEO_TYPES\.has\(f\.type\)/);
          assert.doesNotMatch(front,/id="postMedia" type="file" disabled/);
          assert.doesNotMatch(api,/sk_live_|STREAM_API_SECRET\s*=\s*['"][^'"]{12}/i);
          console.log('PASS: Pulse source/auth structure and restricted schema checks');
          JS
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check staged deployed-source parity
        run: |
          deno check supabase/functions/nbl-social/index.ts
          deno check supabase/functions/nbl-stream/index.ts

      - name: Probe live Stream connectivity and reject unauthenticated Pulse access
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://tvypdakofcrlvnwporhh.supabase.co/functions/v1/';
          const h=await fetch(base+'nbl-stream?action=health',{signal:AbortSignal.timeout(12000)});
          const health=await h.json();
          console.log('Stream health:',h.status,health.code,health.connected);
          assert.equal(h.status,200,'Stream bridge must have valid provider connection');
          assert.equal(health.connected,true);
          for(const action of ['nbl-stream','nbl-social']){
            const r=await fetch(base+action,{method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({action:'session'}),signal:AbortSignal.timeout(12000)});
            console.log(action,'anonymous status',r.status);
            assert.equal(r.status,401,'A signed-out caller cannot access social data');
          }
          JS
