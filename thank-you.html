<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | New Beansland</title>
  <meta name="description" content="Thank you for purchasing a New Beansland ebook.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://newbeansland.org/thank-you.html">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #24345e 0%, #0c1224 48%, #050811 100%);
      color: #fff;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: rgba(7, 12, 28, 0.86);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #101a39;
      font-size: 38px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
    }

    p {
      margin: 12px auto;
      max-width: 540px;
      color: #dbe2f4;
      font-size: clamp(1rem, 3.5vw, 1.18rem);
      line-height: 1.65;
    }

    .important {
      margin-top: 24px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    a {
      display: inline-block;
      margin-top: 26px;
      padding: 14px 22px;
      border-radius: 999px;
      background: #fff;
      color: #101a39;
      font-weight: 800;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #9cc4ff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Thank you for your purchase.</h1>
    <p>Your New Beansland ebook will be delivered to the email address you entered during checkout.</p>
    <p class="important">Please allow time for delivery and check your spam or junk folder. Keep your PayPal receipt as proof of purchase.</p>
    <a href="https://newbeansland.org/">Return to New Beansland</a>
  </main>
</body>
</html>
